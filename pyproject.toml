[project]
name = "tbrec"
version = "0.1.0"
description = "Automated feature construction vs hand-crafted features for ranking on Yambda-50M"
requires-python = ">=3.12,<3.13"
dependencies = [
  "polars>=1.30",
  "pyarrow>=18",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "optuna>=4.0",
  "implicit>=0.7.2",
  "shap>=0.46",
  "matplotlib>=3.9",
  "huggingface_hub>=0.25",
  "pyyaml>=6",
  "pytest>=8",
  "psutil>=6",
]

[project.optional-dependencies]
nn = ["torch>=2.5"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
